worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $uri $static_cache {
    ~*\.html$ "no-cache";
    ~*\.(js|css|png|svg|ico|woff2?)$ "public, max-age=31536000, immutable";
    default "no-cache";
  }
  # AKSK Server 多实例集群（共享 MySQL/Redis，无粘性路由）
  upstream aksk_cluster {
    server host.docker.internal:8280;
    server host.docker.internal:8281;
  }
  server {
    listen 80;

    # 管理端 SPA（构建基路径 /app/aksk/）
    location /app/aksk/ {
      alias /www/aksk-admin/;
      try_files $uri $uri/ /app/aksk/index.html;
      add_header Cache-Control $static_cache;
    }

    # 反代自己的 AKSK Server（Bearer 形态，浏览器不带 Cookie）
    location /api/ {
      proxy_pass http://aksk_cluster;
      proxy_set_header Host $http_host;
      # 门户同域场景浏览器必带 IAM 会话 Cookie；资源层防歧义设计见 Cookie 即拒。
      # /api 是纯 Bearer 机器面，Cookie 在此层剥除（资源 SDK 后续收窄歧义判定后可移除）。
      proxy_set_header Cookie "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
